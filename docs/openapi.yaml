openapi: 3.0.3
info:
  title: SecIncident API
  version: 1.0.0
  description: MVP REST API pelaporan & pelacakan insiden keamanan siber (UTS Pemrograman
    Web Lanjut).
servers:
- url: http://localhost:5000
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            details:
              type: object
paths:
  /health:
    get:
      summary: Cek kesehatan layanan (tanpa API key)
      tags:
      - system
      responses:
        '200':
          description: Berhasil
  /api/v1/users:
    post:
      summary: Buat user
      tags:
      - users
      responses:
        '201':
          description: Berhasil
        '401':
          description: API key salah/tidak ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Konflik (duplikat/referensi/transisi tidak valid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validasi input gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              username: analyst3
              email: analyst3@example.test
              password: Password123!
              role: analyst
    get:
      summary: Daftar user (filter role, q; sort; paginasi)
      tags:
      - users
      responses:
        '200':
          description: Berhasil
        '401':
          description: API key salah/tidak ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: role
        in: query
        schema:
          type: string
        example: analyst
      - name: q
        in: query
        schema:
          type: string
        example: analyst
      - name: sort
        in: query
        schema:
          type: string
        example: username
      - name: page
        in: query
        schema:
          type: string
        example: '1'
      - name: per_page
        in: query
        schema:
          type: string
        example: '10'
  /api/v1/users/{id}:
    get:
      summary: Detail user
      tags:
      - users
      responses:
        '200':
          description: Berhasil
        '401':
          description: API key salah/tidak ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Data tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      summary: Ganti user (lengkap)
      tags:
      - users
      responses:
        '200':
          description: Berhasil
        '401':
          description: API key salah/tidak ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Data tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Konflik (duplikat/referensi/transisi tidak valid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validasi input gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            example:
              username: analyst3
              email: analyst3@example.test
              password: Password123!
              role: analyst
    patch:
      summary: Ubah sebagian user
      tags:
      - users
      responses:
        '200':
          description: Berhasil
        '401':
          description: API key salah/tidak ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Data tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validasi input gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            example:
              role: admin
    delete:
      summary: Hapus user (409 bila masih direferensikan)
      tags:
      - users
      responses:
        '204':
          description: Berhasil
        '401':
          description: API key salah/tidak ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Data tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Konflik (duplikat/referensi/transisi tidak valid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
